services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      FLASK_DEBUG: "0"
      DATABASE_PATH: "/app/instance/demo.db"
      SESSION_COOKIE_SECURE: "0"
      SECRET_KEY: "${SECRET_KEY:-local-docker-demo-secret}"

    volumes:
      - demo_data:/app/instance

    restart: unless-stopped

volumes:
  demo_data: